<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন · Shohayok</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<nav>
  <a class="logo" href="admin.html"><b>সহ</b> Shohayok <span class="abadge">অ্যাডমিন</span></a>
  <div class="links"></div>
  <div class="row" id="aNav"></div>
</nav>

<!-- ============ অ্যাডমিন লগইন ============ -->
<div class="view on" id="v-alogin">
  <main class="wrap narrow">
    <div class="card">
      <h2>অ্যাডমিন লগইন</h2><p class="mute">শুধু অনুমোদিত অ্যাডমিনদের জন্য</p>
      <form id="aLogin" novalidate>
        <label class="field">মোবাইল নম্বর<input name="phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" required></label>
        <label class="field">পাসওয়ার্ড<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn main full" type="submit">লগইন করুন</button>
      </form>
      <p class="swap"><a href="index.html">← মূল সাইটে ফিরুন</a></p>
    </div>
  </main>
</div>
<div class="view" id="v-admin">
  <main class="wrap">
    <div class="head" style="margin-top:50px"><h2>অ্যাডমিন প্যানেল</h2><p>সহায়কদের NID দেখে অনুমোদন করুন বা বিতর্ক মীমাংসা করুন।</p></div>
    <div class="astats" id="aStats"></div>
    <div class="tabs" id="aTabs">
      <button class="tab on" data-s="pending">অপেক্ষমাণ</button>
      <button class="tab" data-s="approved">অনুমোদিত</button>
      <button class="tab" data-s="rejected">বাতিল</button>
      <button class="tab" data-s="dispute">বিতর্ক ও অভিযোগ</button>
      <button class="tab" data-s="tasks">সব কাজ</button>
    </div>
    <div class="alist" id="aList"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script src="tasks.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
